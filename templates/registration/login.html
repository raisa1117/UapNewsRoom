{% extends "base.html" %}
{% block content %}
<div class="card slim"><h1>Log in</h1>
<form method="post" class="form">{% csrf_token %}{% for f in form %}<label>{{ f.label }}{{ f }}</label>{% endfor %}
{% if form.errors %}<small class="bad">Wrong username or password.</small>{% endif %}
<button class="btn" type="submit">Log in</button></form>
<p class="hint">New here? <a href="{% url 'signup' %}">Create an account</a></p></div>
{% endblock %}
